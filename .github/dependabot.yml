version: 2
updates:
  - package-ecosystem: npm
    directory: /clients
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      client-development:
        dependency-type: development
      client-runtime:
        dependency-type: production

  - package-ecosystem: cargo
    directory: /clients/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
