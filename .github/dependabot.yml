version: 2
updates:
  - package-ecosystem: npm
    directory: /clients
    schedule:
      interval: monthly
      day: monday
      time: "06:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    groups:
      client-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /clients/desktop/src-tauri
    schedule:
      interval: monthly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    groups:
      desktop-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "06:45"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
