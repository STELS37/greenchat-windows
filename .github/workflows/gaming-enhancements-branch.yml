name: gaming-enhancements-branch

# One-shot validation for the non-release feature branch. The job deletes this file after success.
on:
  push:
    branches:
      - work/gaming-mode-connections-ripple-v5

permissions:
  contents: write

concurrency:
  group: gaming-enhancements-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: clients/package-lock.json

      - name: Materialize reviewed integration
        run: node scripts/integrate-gaming-enhancements.mjs

      - name: Install locked dependencies
        working-directory: clients
        run: npm ci --ignore-scripts

      - name: Type-check
        working-directory: clients
        run: npm run check

      - name: Test public client
        working-directory: clients
        run: npm test

      - name: Remove one-shot staging helpers
        run: rm -rf scripts/gaming-enhancements-payload scripts/integrate-gaming-enhancements.mjs .github/workflows/gaming-enhancements-branch.yml

      - name: Commit integrated source back to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git commit -m 'feat(ui): integrate gaming connections and tap ripple [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
